<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Frontend Masters Progress Check</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}body{margin:0;background:Canvas;color:CanvasText}main{max-width:820px;margin:0 auto;padding:28px 18px 64px}h1{margin-bottom:6px}.sub{opacity:.75;margin-top:0}fieldset{margin:20px 0;padding:18px;border-radius:12px}label{display:block;font-weight:650;margin:14px 0 6px}input,select,textarea,button{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border-radius:8px;border:1px solid color-mix(in srgb,CanvasText 25%,transparent);background:Canvas;color:CanvasText}textarea{min-height:92px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.checks label{font-weight:500;display:flex;gap:8px;align-items:center;margin:0}.checks input{width:auto}button{cursor:pointer;font-weight:700;margin-top:10px}.status{margin-top:12px;font-weight:650}.small{font-size:.9rem;opacity:.7}@media(max-width:640px){.row,.checks{grid-template-columns:1fr}}</style>
</head>
<body>
<main>
<h1>Frontend Masters Progress Check</h1>
<p class="sub">Level 1 ThirdStreet/Jamal OS adapter: course link → lesson/workshop → structured evidence.</p>
<form id="form">
<fieldset><legend><strong>Assignment</strong></legend>
<label for="course">Course / workshop</label><input id="course" required placeholder="e.g. Complete Intro to React" />
<label for="url">Frontend Masters URL</label><input id="url" type="url" required placeholder="Paste the course or lesson link" />
<div class="row"><div><label for="lesson">Lesson / section reached</label><input id="lesson" required placeholder="Exact lesson or section" /></div><div><label for="minutes">Minutes spent</label><input id="minutes" type="number" min="0" required /></div></div>
</fieldset>
<fieldset><legend><strong>Evidence</strong></legend>
<label for="outcome">Outcome</label><select id="outcome" required><option value="">Choose…</option><option>Completed assigned lesson independently</option><option>Completed with support/reference</option><option>Partially completed</option><option>Watched/understood but did not reproduce</option><option>Blocked</option><option>Stopped at timebox</option></select>
<label>What did you actually produce?</label><div class="checks"><label><input type="checkbox" name="produced" value="notes" />Notes</label><label><input type="checkbox" name="produced" value="code" />Code</label><label><input type="checkbox" name="produced" value="exercise" />Exercise/project work</label><label><input type="checkbox" name="produced" value="retrieval" />Closed-book retrieval</label></div>
<label for="independent">Independent reproduction</label><select id="independent" required><option value="">Choose…</option><option>Yes</option><option>Partially</option><option>No</option></select>
<label for="confidence">Confidence (1–5)</label><input id="confidence" type="number" min="1" max="5" required />
<label for="learned">What can you now explain or do?</label><textarea id="learned"></textarea>
<label for="gap">Exact Gap / failure, if any</label><textarea id="gap" placeholder="Be specific: what failed when you tried to produce it?"></textarea>
<label for="support">Support used</label><textarea id="support" placeholder="Course replay, docs, instructor repo, hints, ChatGPT, etc."></textarea>
<label for="restart">Exact restart point / next action</label><textarea id="restart" required></textarea>
</fieldset>
<button type="submit">Create Progress Artifact</button>
<button type="button" id="download">Download JSON</button>
<p id="status" class="status"></p>
<p class="small">This tool does not access Frontend Masters account data or private APIs. It records learner-confirmed evidence only.</p>
</form>
<script>
const form=document.getElementById('form'),status=document.getElementById('status');let latest=null;
function payload(){return {schema:'thirdstreet.frontend-masters.level1.v1',provider:'Frontend Masters',capturedAt:new Date().toISOString(),course:course.value.trim(),url:url.value.trim(),lesson:lesson.value.trim(),minutes:Number(minutes.value||0),outcome:outcome.value,produced:[...document.querySelectorAll('input[name=produced]:checked')].map(x=>x.value),independent:independent.value,confidence:Number(confidence.value||0),learned:learned.value.trim(),gap:gap.value.trim(),support:support.value.trim(),restart:restart.value.trim()}}
form.addEventListener('submit',e=>{e.preventDefault();latest=payload();localStorage.setItem('fem-progress-latest',JSON.stringify(latest));status.textContent='Progress artifact created and saved locally.'});
document.getElementById('download').addEventListener('click',()=>{latest=latest||payload();const blob=new Blob([JSON.stringify(latest,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`frontend-masters-progress-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);status.textContent='JSON downloaded.'});
</script>
</main>
</body>
</html>
