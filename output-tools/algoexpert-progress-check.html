<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AlgoExpert Progress Check</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: light dark; }
    body { margin: 0; background: Canvas; color: CanvasText; }
    main { max-width: 820px; margin: 0 auto; padding: 28px 18px 64px; }
    h1 { margin-bottom: 6px; }
    .sub { opacity: .75; margin-top: 0; }
    fieldset { margin: 20px 0; padding: 18px; border-radius: 12px; }
    label { display: block; font-weight: 650; margin: 14px 0 6px; }
    input, select, textarea, button { width: 100%; box-sizing: border-box; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); background: Canvas; color: CanvasText; }
    textarea { min-height: 92px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .checks { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .checks label { font-weight: 500; display: flex; gap: 8px; align-items: center; margin: 0; }
    .checks input { width: auto; }
    button { cursor: pointer; font-weight: 700; margin-top: 10px; }
    .secondary { margin-top: 8px; }
    .status { margin-top: 12px; font-weight: 650; }
    .small { font-size: .9rem; opacity: .7; }
    @media (max-width: 640px) { .row, .checks { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<main>
  <h1>AlgoExpert Progress Check</h1>
  <p class="sub">Level 1 ThirdStreet/Jamal OS adapter: deep link → practice → structured evidence.</p>

  <form id="form">
    <fieldset>
      <legend><strong>Assignment</strong></legend>
      <label for="problem">Problem name</label>
      <input id="problem" required placeholder="e.g. Two Number Sum" />

      <label for="url">AlgoExpert problem URL</label>
      <input id="url" type="url" required placeholder="Paste the AlgoExpert problem link" />

      <div class="row">
        <div>
          <label for="category">Category / pattern</label>
          <input id="category" placeholder="Arrays, recursion, trees, graphs…" />
        </div>
        <div>
          <label for="difficulty">Difficulty</label>
          <select id="difficulty">
            <option value="">Not recorded</option>
            <option>Easy</option><option>Medium</option><option>Hard</option><option>Very Hard</option>
          </select>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend><strong>Attempt</strong></legend>
      <div class="row">
        <div>
          <label for="minutes">Minutes spent</label>
          <input id="minutes" type="number" min="0" step="1" required />
        </div>
        <div>
          <label for="outcome">Outcome</label>
          <select id="outcome" required>
            <option value="">Choose…</option>
            <option value="solved-independent">Solved independently</option>
            <option value="solved-with-help">Solved with help</option>
            <option value="partial">Partial solution</option>
            <option value="not-solved">Not solved</option>
            <option value="stopped-timebox">Stopped at timebox</option>
          </select>
        </div>
      </div>

      <label>Assistance used</label>
      <div class="checks">
        <label><input type="checkbox" id="hint" /> AlgoExpert hint</label>
        <label><input type="checkbox" id="solution" /> AlgoExpert solution</label>
        <label><input type="checkbox" id="docs" /> Documentation/reference</label>
        <label><input type="checkbox" id="ai" /> AI assistance</label>
      </div>

      <label for="confidence">Confidence after attempt (1–5)</label>
      <select id="confidence" required>
        <option value="">Choose…</option>
        <option value="1">1 — cannot reproduce</option>
        <option value="2">2 — recognize / explain parts</option>
        <option value="3">3 — can implement with help</option>
        <option value="4">4 — can implement independently</option>
        <option value="5">5 — fluent / transferable</option>
      </select>

      <label for="approach">Approach used</label>
      <textarea id="approach" placeholder="Briefly describe the algorithm/data structure and why it works."></textarea>

      <label for="failure">Exact failure or gap</label>
      <textarea id="failure" placeholder="If anything failed: what specifically broke, confused you, or required help?"></textarea>

      <label for="complexity">Time / space complexity</label>
      <input id="complexity" placeholder="e.g. O(n) time, O(n) space" />
    </fieldset>

    <fieldset>
      <legend><strong>Next step</strong></legend>
      <label for="nextAction">What should happen next?</label>
      <select id="nextAction" required>
        <option value="">Choose…</option>
        <option value="advance">Advance to next problem</option>
        <option value="retest">Delayed retest</option>
        <option value="remediate">Targeted remediation</option>
        <option value="repeat">Repeat same problem closed-book</option>
        <option value="related">Do a related transfer problem</option>
      </select>

      <label for="notes">Optional evidence / notes</label>
      <textarea id="notes" placeholder="Commit URL, key debugging observation, or anything the scheduler should know."></textarea>
    </fieldset>

    <button type="submit">Complete Progress Check</button>
    <button type="button" class="secondary" id="export" disabled>Export JSON</button>
    <button type="button" class="secondary" id="new">New Attempt</button>
    <div class="status" id="status" role="status"></div>
    <p class="small">Data stays in this browser until you export it. This tool does not read AlgoExpert or call undocumented APIs.</p>
  </form>
</main>
<script>
const form = document.getElementById('form');
const statusEl = document.getElementById('status');
const exportBtn = document.getElementById('export');
let latest = null;

function val(id) { return document.getElementById(id).value.trim(); }
function checked(id) { return document.getElementById(id).checked; }
function slug(s) { return (s || 'algoexpert').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60); }

form.addEventListener('submit', (e) => {
  e.preventDefault();
  const now = new Date();
  latest = {
    schema: 'thirdstreet.algoexpert.progress-check.v1',
    submittedAt: now.toISOString(),
    provider: 'AlgoExpert',
    integrationLevel: 1,
    problem: {
      name: val('problem'),
      url: val('url'),
      category: val('category'),
      difficulty: val('difficulty')
    },
    attempt: {
      minutesSpent: Number(val('minutes')),
      outcome: val('outcome'),
      assistance: {
        hintViewed: checked('hint'),
        solutionViewed: checked('solution'),
        docsUsed: checked('docs'),
        aiUsed: checked('ai')
      },
      confidence: Number(val('confidence')),
      approach: val('approach'),
      exactGap: val('failure'),
      complexity: val('complexity')
    },
    next: {
      action: val('nextAction'),
      notes: val('notes')
    }
  };
  localStorage.setItem('thirdstreet-algoexpert-latest', JSON.stringify(latest));
  exportBtn.disabled = false;
  statusEl.textContent = 'Progress Check complete. Export the JSON as the evidence artifact.';
});

exportBtn.addEventListener('click', () => {
  if (!latest) return;
  const blob = new Blob([JSON.stringify(latest, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const date = latest.submittedAt.slice(0,10);
  a.download = `algoexpert-${date}-${slug(latest.problem.name)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});

document.getElementById('new').addEventListener('click', () => {
  form.reset();
  latest = null;
  exportBtn.disabled = true;
  statusEl.textContent = '';
});

const saved = localStorage.getItem('thirdstreet-algoexpert-latest');
if (saved) {
  try { latest = JSON.parse(saved); exportBtn.disabled = false; statusEl.textContent = 'A previous submission is available for export.'; } catch (_) {}
}
</script>
</body>
</html>
